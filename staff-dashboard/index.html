<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Private staff portal for MediTrust Health Centre."
    />
    <title>Staff Login | MediTrust Health Centre</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="login-page">
      <section class="login-card">
        <div class="brand">
          <span class="brand-icon">✚</span>
          <span class="brand-name">
            MediTrust
            <small>HEALTH CENTRE</small>
          </span>
        </div>

        <div class="login-heading">
          <span class="portal-label">STAFF PORTAL</span>
          <h1>Welcome Back</h1>
          <p>Sign in to access the MediTrust staff dashboard.</p>
        </div>

        <form id="loginForm">
          <div class="form-group">
            <label for="email">Staff Email Address</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Enter your staff email"
              autocomplete="username"
              required
            />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            />
          </div>

          <button type="submit" id="loginButton">Sign In</button>

          <p id="loginMessage" role="status" aria-live="polite"></p>
        </form>

        <p class="security-note">
          <span>🔒</span>
          Authorized MediTrust staff only.
        </p>

        <footer>
          &copy; <span id="year"></span> MediTrust Health Centre. All rights
          reserved.
        </footer>
      </section>
    </main>

    <script type="module" src="script.js"></script>
  </body>
</html>
